# Alvos de coleta.
#
# Estavam todos em 'localhost'. O Prometheus roda no próprio contêiner, então
# 'localhost' é ele mesmo: as cinco coletas falhavam com conexão recusada. Na
# rede do Docker Compose os serviços se resolvem pelo nome do contêiner.
#
# ATENÇÃO — nenhuma métrica de aplicação é exportada hoje.
#
# A instrumentação Prometheus vivia no crm_api.py, que foi aposentado. O
# serviço oficial (crm_whatsapp_webhook.py) e o app Streamlit não expõem
# /metrics. Este arquivo, o alert_rules.yml e o grafana/ ficaram como
# infraestrutura pronta, mas sem nada de aplicação para coletar.
#
# Os alvos de banco e cache continuam válidos, desde que os respectivos
# exporters sejam de fato executados — hoje eles não estão no compose.
# prometheus.yml - Prometheus configuration
global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    monitor: 'crm-monitor'

# Alerting configuration
alerting:
  alertmanagers:
    - static_configs:
        # Sem alertmanager configurado, as regras de alerta são avaliadas e
        # descartadas em silêncio — ninguém é notificado de nada. Preencha o
        # endereço do seu alertmanager para que os alertas saiam daqui.
        - targets: []

# Load rules once and periodically evaluate them
rule_files:
  - "alert_rules.yml"

# Scrape configurations
scrape_configs:
  # FastAPI application metrics
  - job_name: 'crm-api'
    static_configs:
      - targets: ['crm-servico:8000']  # nome do contêiner, não localhost
    metrics_path: '/metrics'
    scrape_interval: 5s

  # Prometheus self-monitoring
  - job_name: 'prometheus'
    static_configs:
      - targets: ['crm-prometheus:9090']

  # PostgreSQL metrics (if using postgres_exporter)
  - job_name: 'postgres'
    static_configs:
      - targets: ['crm-postgres-exporter:9187']
    relabel_configs:
      - source_labels: [__address__]
        target_label: instance

  # Redis metrics (if using redis_exporter)
  - job_name: 'redis'
    static_configs:
      - targets: ['crm-redis-exporter:9121']
    relabel_configs:
      - source_labels: [__address__]
        target_label: instance

  # Node exporter (system metrics)
  - job_name: 'node'
    static_configs:
      - targets: ['crm-node-exporter:9100']
    relabel_configs:
      - source_labels: [__address__]
        target_label: instance
